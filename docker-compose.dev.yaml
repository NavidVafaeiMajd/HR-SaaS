# docker compose -f docker-compose.dev.yaml up --build

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hr_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - hr-network
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_api
    working_dir: /src/backend
    command: dotnet watch run --urls=http://+:8080 --non-interactive
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=HrSaaS;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    volumes:
      - .:/src
      - /src/backend/bin
      - /src/backend/obj
      - nuget_cache:/root/.nuget/packages
      - uploads:/src/backend/wwwroot/uploads
    networks:
      - hr-network

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_client
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    volumes:
    - ./frontend:/app
    - /app/node_modules
    networks:
      - hr-network

volumes:
  sqlserver-data:
  nuget_cache:
  uploads:

networks:
  hr-network:
