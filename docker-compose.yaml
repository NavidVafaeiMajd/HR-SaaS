#for run docker compose up --build for Production
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PerformanceDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -Q 'SELECT 1' -No"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s


  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  sql_data:
  nuget_cache:
  redis_data: